<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스 번역기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f4; --bg3: #eeede9;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --text: #1a1a1a; --text2: #555; --text3: #999;
    --blue: #185fa5; --blue-bg: #e6f1fb; --blue-border: rgba(24,95,165,0.3);
    --green: #0f6e56; --green-bg: #e1f5ee; --green-border: rgba(15,110,86,0.3);
    --amber: #854f0b; --amber-bg: #faeeda; --amber-border: rgba(133,79,11,0.3);
    --red: #a32d2d; --red-bg: #fcebeb; --red-border: rgba(163,45,45,0.3);
    --radius: 8px; --radius-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { font-family: var(--font); background: #e8e8e6; color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Top chrome ── */
  #chrome {
    background: var(--bg2); border-bottom: 0.5px solid var(--border);
    padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  #chrome .title { font-size: 16px; font-weight: 600; color: var(--text); flex: 1; }
  #save-status { font-size: 13px; color: var(--green); background: var(--green-bg); border: 0.5px solid var(--green-border); border-radius: 6px; padding: 4px 10px; display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity 0.4s; }
  #save-status.show { opacity: 1; }

  /* ── Main layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: 240px; flex-shrink: 0; background: var(--bg2);
    border-right: 0.5px solid var(--border);
    display: flex; flex-direction: column; transition: width 0.2s ease; overflow: hidden;
  }
  #sidebar.collapsed { width: 36px; }
  #sidebar.collapsed #sidebar-inner { display: none; }
  #sidebar-toggle-btn:hover { background: var(--bg3) !important; color: var(--text) !important; }
  #sidebar-collapsed-dots { display: none; flex-direction: column; gap: 5px; align-items: center; padding-top: 44px; }
  #sidebar.collapsed #sidebar-collapsed-dots { display: flex; }
  .collapsed-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); }
  .collapsed-dot.done { background: var(--green); }
  .collapsed-dot.working { background: var(--amber); }

  #sidebar-inner { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  #url-form { padding: 10px; border-bottom: 0.5px solid var(--border); display: flex; gap: 6px; }
  #url-input { flex: 1; height: 34px; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 0 10px; font-size: 14px; font-family: var(--font); background: var(--bg); color: var(--text); outline: none; }
  #url-input:focus { border-color: var(--blue); }
  #url-input::placeholder { color: var(--text3); }
  #url-add-btn { height: 34px; padding: 0 12px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); font-size: 14px; cursor: pointer; color: var(--text2); font-family: var(--font); }
  #url-add-btn:hover { background: var(--bg3); }

  #article-list-header { padding: 6px 10px 4px; display: flex; justify-content: space-between; align-items: center; }
  #article-list-header span { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; }
  #article-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 5px; }

  .article-item {
    border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--bg);
    padding: 10px 10px; cursor: pointer; display: flex; gap: 6px; align-items: flex-start;
    transition: border-color 0.15s; position: relative; user-select: none;
  }
  .article-item:hover { border-color: var(--border2); }
  .article-item.active { border-color: var(--blue-border); background: var(--blue-bg); }
  .article-item.dragging { opacity: 0.4; }
  .article-item.drag-over { border-color: var(--blue); border-style: dashed; }

  .drag-handle { display: flex; flex-direction: column; gap: 2.5px; padding-top: 3px; cursor: grab; flex-shrink: 0; opacity: 0.35; }
  .drag-handle:hover { opacity: 0.7; }
  .drag-handle span { display: block; width: 12px; height: 1.5px; border-radius: 1px; background: var(--text2); }
  .article-item-body { flex: 1; min-width: 0; }
  .article-item-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .article-item-domain { font-size: 13px; color: var(--text2); }
  .article-item-num { font-size: 11px; color: var(--text3); }
  .status-badge { border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 600; }
  .status-badge.done { background: var(--green-bg); color: var(--green); }
  .status-badge.working { background: var(--amber-bg); color: var(--amber); }
  .status-badge.pending { background: var(--bg3); color: var(--text3); }
  .status-badge.error { background: var(--red-bg); color: var(--red); }
  .article-item-title { font-size: 14px; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .article-delete-btn { flex-shrink: 0; background: none; border: none; cursor: pointer; color: var(--text3); padding: 2px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity 0.15s; line-height: 1; }
  .article-item:hover .article-delete-btn { opacity: 1; }
  .article-delete-btn:hover { color: var(--red); background: var(--red-bg); }

  /* ── Right panel ── */
  #panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  #panel-topbar { padding: 8px 14px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; background: var(--bg); }
  #panel-source { font-size: 14px; color: var(--text2); flex: 1; }
  .panel-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 17px; }

  #panel-content { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  /* ── Section boxes ── */
  .section-box { border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .section-header { padding: 7px 10px; background: var(--bg2); border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .section-label { font-size: 14px; font-weight: 600; color: var(--text2); }
  .section-label .hint { font-weight: 400; opacity: 0.6; }
  .section-controls { display: flex; gap: 5px; align-items: center; }

  /* Iteration nav */
  .iter-nav { display: flex; align-items: center; gap: 1px; border: 0.5px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--bg); }
  .iter-btn { border: none; background: none; cursor: pointer; color: var(--text3); padding: 4px 10px; font-size: 16px; line-height: 1; }
  .iter-btn:hover { background: var(--bg2); color: var(--text); }
  .iter-btn:disabled { opacity: 0.3; cursor: default; }
  .iter-count { font-size: 13px; color: var(--text2); padding: 0 6px; min-width: 34px; text-align: center; border-left: 0.5px solid var(--border); border-right: 0.5px solid var(--border); }

  /* Small button */
  .btn-sm { border: 0.5px solid var(--border2); border-radius: 6px; background: var(--bg); padding: 5px 12px; font-size: 13px; color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-family: var(--font); white-space: nowrap; }
  .btn-sm:hover { background: var(--bg2); }
  .btn-sm.primary { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-border); }
  .btn-sm.primary:hover { filter: brightness(0.95); }
  .btn { border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); padding: 7px 16px; font-size: 14px; color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-family: var(--font); }
  .btn:hover { background: var(--bg2); }

  /* ── Titles section ── */
  .title-pair { padding: 10px 14px; border-bottom: 0.5px solid var(--border); display: flex; flex-direction: column; gap: 7px; cursor: pointer; transition: background 0.1s; }
  .title-pair:last-child { border-bottom: none; }
  .title-pair:hover { background: var(--bg2); }
  .title-pair.active { border-left: 3px solid var(--blue); background: var(--blue-bg); padding-left: 11px; }
  .title-pair-num { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
  .title-pair.active .title-pair-num { color: var(--blue); }
  .title-input { border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 7px 10px; font-family: var(--font); color: var(--text); background: var(--bg); outline: none; width: 100%; transition: border-color 0.15s; }
  .title-input:focus { border-color: var(--blue); background: #fff; }
  .title-main-input { font-size: 16px; font-weight: 600; }
  .title-sub-input { font-size: 14px; color: var(--text2); }

  /* ── Image section ── */
  #image-wrap { display: flex; gap: 0; }
  #image-preview { width: 52%; height: 100%; flex-shrink: 0; background: var(--bg2); border-right: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #image-preview img { width: 100%; height: 100%; object-fit: contain; }
  #image-placeholder { color: var(--text3); font-size: 11px; text-align: center; }
  #image-info { flex: 1; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  #image-prompt-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
  #image-prompt-text { font-size: 14px; color: var(--text2); line-height: 1.55; }

  /* ── Body section ── */
  #body-content {
    padding: 16px 18px; font-size: 18px; line-height: 1.9; color: var(--text);
    flex: 1; overflow-y: auto; outline: none; white-space: pre-wrap; min-height: 0;
  }
  #body-content:focus { background: #fafaf9; }
  #body-content[contenteditable="true"] { cursor: text; }
  .body-placeholder { color: var(--text3); font-style: italic; }
  .working-msg { padding: 20px; font-size: 15px; color: var(--text3); text-align: center; }

  /* ── Split view ── */
  #split-view { display: none; flex: 1; overflow: hidden; min-height: 0; }
  .split-pane { flex: 1; overflow-y: auto; padding: 16px 18px; font-size: 16px; line-height: 1.85; color: var(--text); }
  .split-pane + .split-pane { border-left: 0.5px solid var(--border); }
  .split-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }

  /* ── Custom prompt row ── */
  .custom-prompt-row { padding: 8px 12px; border-top: 0.5px solid var(--border); display: flex; gap: 8px; align-items: center; flex-shrink: 0; background: var(--bg2); }
  .custom-prompt-row input { flex: 1; height: 34px; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 0 10px; font-size: 13px; font-family: var(--font); color: var(--text); background: var(--bg); outline: none; }
  .custom-prompt-row input:focus { border-color: var(--blue); }
  .custom-prompt-row input::placeholder { color: var(--text3); }

  /* ── Settings modal ── */
  #settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: center; justify-content: center; }
  #settings-overlay.open { display: flex; }
  #settings-modal { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); width: 860px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
  #settings-header { padding: 12px 16px; background: var(--bg2); border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  #settings-header h2 { font-size: 14px; font-weight: 600; }
  #settings-close { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
  #settings-close:hover { background: var(--bg3); color: var(--text); }
  #settings-body { display: flex; flex: 1; overflow: hidden; }
  #settings-nav { width: 140px; flex-shrink: 0; border-right: 0.5px solid var(--border); background: var(--bg2); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .settings-tab { padding: 7px 10px; border-radius: var(--radius); font-size: 12px; color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .settings-tab:hover { background: var(--bg3); }
  .settings-tab.active { background: var(--bg); border: 0.5px solid var(--border); color: var(--text); font-weight: 500; }
  #settings-content { flex: 1; overflow-y: auto; padding: 16px; }
  .settings-section { display: none; }
  .settings-section.active { display: block; }
  .field-group { margin-bottom: 14px; }
  .field-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; display: block; }
  .field-row { display: flex; gap: 6px; align-items: center; }
  input[type="text"], input[type="password"] {
    height: 30px; border: 0.5px solid var(--border2); border-radius: var(--radius);
    padding: 0 10px; font-size: 12px; font-family: var(--font); color: var(--text); background: var(--bg); outline: none; width: 100%;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: var(--blue); }
  select { height: 30px; border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 0 8px; font-size: 12px; font-family: var(--font); color: var(--text); background: var(--bg); outline: none; }
  select:focus { border-color: var(--blue); }
  textarea { border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 8px 10px; font-size: 12px; font-family: var(--font); color: var(--text); background: var(--bg); outline: none; width: 100%; resize: vertical; line-height: 1.6; }
  textarea:focus { border-color: var(--blue); }
  .divider { height: 0.5px; background: var(--border); margin: 14px 0; }
  .routing-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--bg2); border-radius: var(--radius); border: 0.5px solid var(--border); margin-bottom: 6px; }
  .routing-label { flex: 1; }
  .routing-label strong { font-size: 12px; font-weight: 500; display: block; }
  .routing-label small { font-size: 10px; color: var(--text3); }
  .routing-selects { display: flex; gap: 6px; }
  .settings-footer { padding: 10px 16px; border-top: 0.5px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--bg2); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 11px; background: var(--bg2); border-radius: var(--radius); border: 0.5px solid var(--border); }
  .toggle { width: 34px; height: 20px; border-radius: 10px; position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0; border: none; }
  .toggle.on { background: var(--green); }
  .toggle.off { background: var(--border2); }
  .toggle::after { content: ''; position: absolute; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: left 0.2s; }
  .toggle.on::after { left: 17px; }
  .toggle.off::after { left: 2px; }

  /* ── Prompt sub-tabs ── */
  .prompt-tabs { display: flex; gap: 2px; margin-bottom: 10px; border-bottom: 0.5px solid var(--border); padding-bottom: 6px; }
  .prompt-tab { padding: 4px 10px; border-radius: 6px; font-size: 11px; color: var(--text2); cursor: pointer; }
  .prompt-tab.active { background: var(--blue-bg); color: var(--blue); font-weight: 500; }
  .prompt-tab:hover:not(.active) { background: var(--bg2); }

  /* ── Spinner ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── Cost badge ── */
  .article-cost { font-size: 12px; color: var(--text3); margin-top: 3px; }
  #total-cost { font-size: 13px; color: var(--text2); background: var(--bg3); border: 0.5px solid var(--border); border-radius: 6px; padding: 4px 10px; white-space: nowrap; }

  /* ── Lightbox ── */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 200;
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox-img {
    max-width: 90vw; max-height: 90vh; object-fit: contain;
    border-radius: 6px; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    cursor: default;
  }
  #image-preview img { cursor: zoom-in; }
</style>
</head>
<body>

<!-- Top chrome -->
<div id="chrome">
  <button id="sidebar-toggle-btn" onclick="toggleSidebar()" title="사이드바 접기/펼치기" style="background:none;border:0.5px solid var(--border);border-radius:var(--radius);width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;flex-shrink:0;">◀</button>
  <span class="title">뉴스 번역기</span>
  <div id="save-status">✓ 자동 저장됨</div>
  <span id="total-cost" style="display:none;"></span>
  <button class="btn" onclick="openSettings()">⚙ 설정</button>
  <button class="btn primary" onclick="downloadAll()">↓ 전체 다운로드</button>
</div>

<!-- Main -->
<div id="main">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-inner">
      <form id="url-form" onsubmit="addUrl(event)">
        <input id="url-input" type="text" placeholder="URL 붙여넣기 후 Enter..." autocomplete="off">
        <button type="submit" id="url-add-btn">추가</button>
      </form>
      <div id="article-list-header">
        <span id="article-count">0개 기사</span>
        <span style="font-size:9px;color:var(--text3);">드래그로 순서 변경</span>
      </div>
      <div id="article-list"></div>
    </div>
    <div id="sidebar-collapsed-dots" aria-hidden="true"></div>
  </div>

  <!-- Right panel -->
  <div id="panel">
    <div id="panel-topbar" style="display:none;">
      <span id="panel-source"></span>
      <a id="panel-url" href="#" target="_blank" style="font-size:12px;color:var(--blue);text-decoration:none;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title=""></a>
      <button class="btn-sm" onclick="regenerateAll()">↺ 전체 재생성</button>
      <button class="btn-sm" onclick="downloadSingle()">↓ .txt</button>
    </div>
    <div id="panel-empty" class="panel-empty">← URL을 추가하여 시작하세요</div>
    <div id="panel-content" style="display:none;">

      <!-- Titles + Image (side by side) -->
      <div id="top-row" style="display:flex; border:0.5px solid var(--border); border-radius:var(--radius); overflow:hidden; flex-shrink:0; min-height:380px; resize:vertical;">

        <!-- Left: Titles -->
        <div style="flex:1; display:flex; flex-direction:column; min-width:0; border-right:0.5px solid var(--border);">
          <div class="section-header">
            <span class="section-label">제목 · 소제목</span>
            <div class="section-controls">
              <div class="iter-nav">
                <button class="iter-btn" id="title-prev" onclick="stepTitleIter(-1)">‹</button>
                <span class="iter-count" id="title-iter-count">1/1</span>
                <button class="iter-btn" id="title-next" onclick="stepTitleIter(1)">›</button>
              </div>
              <button class="btn-sm" onclick="regenerateTitles()">↺ 재생성</button>
            </div>
          </div>
          <div id="titles-body" style="flex:1; overflow:hidden; display:flex;"></div>
          <div class="custom-prompt-row">
            <input type="text" id="titles-custom-prompt" placeholder="추가 지시사항 (예: 더 강렬하게, 의문형으로...)">
            <button class="btn-sm" onclick="regenerateTitlesCustom()">↺ 재생성</button>
          </div>
        </div>

        <!-- Right: Image -->
        <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
          <div class="section-header">
            <span class="section-label">생성 이미지</span>
            <div class="section-controls">
              <div class="iter-nav">
                <button class="iter-btn" id="img-prev" onclick="stepImgIter(-1)">‹</button>
                <span class="iter-count" id="img-iter-count">1/1</span>
                <button class="iter-btn" id="img-next" onclick="stepImgIter(1)">›</button>
              </div>
              <button class="btn-sm" onclick="regenerateImage()">↺ 재생성</button>
            </div>
          </div>
          <div id="image-wrap" style="flex:1; overflow:hidden;">
            <div id="image-preview"><div id="image-placeholder">이미지 없음</div></div>
            <div id="image-info" style="flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px;">
              <div>
                <div id="image-prompt-label" style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;">AI 생성 프롬프트</div>
                <div id="image-prompt-text" style="font-size:13px;color:var(--text2);line-height:1.55;">—</div>
              </div>
              <div id="image-full-prompt-wrap" style="display:none;">

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let articles = [];      // ordered list
let selectedId = null;
let settings = {};
let sidebarCollapsed = false;
let dragSrcId = null;
let saveTimer = null;
let splitViewEnabled = false;
let _displayedImageData = null; // always tracks exactly what's shown in the preview

const GEMINI_MODELS = ['gemini-3.5-flash', 'gemini-2.0-flash', 'gemini-2.5-flash-preview-05-20', 'gemini-2.5-pro-preview-05-06'];
const OPENAI_TEXT_MODELS = ['gpt-5.4-2026-03-05', 'gpt-4o', 'gpt-4o-mini'];
const OPENAI_IMAGE_MODELS = ['gpt-image-2-2026-04-21', 'dall-e-3', 'dall-e-2'];
const GEMINI_IMAGE_MODELS = ['gemini-3.1-flash-image', 'gemini-3-pro-image'];

const IMAGE_SIZES = {
  'gpt-image-2-2026-04-21': [
    { v:'1024x1024', l:'1024×1024 — 1:1' },
    { v:'1536x1024', l:'1536×1024 — 3:2 가로' },
    { v:'1024x1536', l:'1024×1536 — 2:3 세로' },
    { v:'auto',      l:'auto' },
  ],
  'gpt-image-2': [
    { v:'1024x1024', l:'1024×1024 — 1:1' },
    { v:'1536x1024', l:'1536×1024 — 3:2 가로' },
    { v:'1024x1536', l:'1024×1536 — 2:3 세로' },
    { v:'auto',      l:'auto' },
  ],
  'dall-e-3': [
    { v:'1024x1024', l:'1024×1024 — 1:1' },
    { v:'1792x1024', l:'1792×1024 — 16:9 가로' },
    { v:'1024x1792', l:'1024×1792 — 9:16 세로' },
  ],
  'dall-e-2': [
    { v:'256x256',   l:'256×256' },
    { v:'512x512',   l:'512×512' },
    { v:'1024x1024', l:'1024×1024' },
  ],
};
const DEFAULT_IMAGE_SIZES = [
  { v:'1024x1024', l:'1024×1024 — 1:1' },
  { v:'1536x1024', l:'1536×1024 — 3:2 가로' },
  { v:'1024x1536', l:'1024×1536 — 2:3 세로' },
];

// ─── Pricing (USD per 1M tokens; image = USD per image) ───────────────────────
const USD_TO_CAD = 1.37;
const TEXT_PRICE = {
  'gemini-3.5-flash':               { in: 0.10, out: 0.40 },
  'gemini-2.0-flash':               { in: 0.10, out: 0.40 },
  'gemini-2.5-flash-preview-05-20': { in: 0.15, out: 0.60 },
  'gemini-2.5-pro-preview-05-06':   { in: 1.25, out: 5.00 },
  'gpt-5.4-2026-03-05':             { in: 2.50, out: 10.00 },
  'gpt-4o':                         { in: 2.50, out: 10.00 },
  'gpt-4o-mini':                    { in: 0.15, out: 0.60 },
};
const IMG_PRICE = {
  'gpt-image-2-2026-04-21': 0.04,
  'gpt-image-2':            0.04,
  'dall-e-3':               0.04,
  'dall-e-2':               0.018,
  'gemini-3.1-flash-image': 0.04,
  'gemini-3-pro-image':     0.08,
};
function calcTextCostCAD(model, inTok, outTok) {
  const p = TEXT_PRICE[model];
  if (!p || !inTok) return 0;
  return ((inTok * p.in + outTok * p.out) / 1_000_000) * USD_TO_CAD;
}
function calcImgCostCAD(model) {
  return (IMG_PRICE[model] || 0.04) * USD_TO_CAD;
}
function articleCostCAD(a) {
  const c = a.cost || {};
  return (c.translation || 0) + (c.titles || 0) + (c.image || 0);
}
function fmtCAD(n) { return n > 0 ? `CA$${n < 0.0001 ? n.toFixed(6) : n.toFixed(4)}` : ''; }
function updateTotalCost() {
  const total = articles.reduce((s, a) => s + articleCostCAD(a), 0);
  const el = document.getElementById('total-cost');
  if (total > 0) { el.textContent = `총 CA$${total.toFixed(4)}`; el.style.display = ''; }
  else el.style.display = 'none';
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  settings = await fetch('/api/settings').then(r => r.json());
  if (settings.autoLoadToday) {
    const today = await fetch('/api/load-today').then(r => r.json());
    if (today.articles && today.articles.length > 0) {
      articles = today.articles;
      if (articles.length > 0) selectedId = articles[0].id;
    }
  }
  renderSidebar();
  renderPanel();

  // Restore saved top-row height and persist future resizes
  const topRow = document.getElementById('top-row');
  if (topRow) {
    const saved = localStorage.getItem('topRowHeight');
    if (saved) topRow.style.height = saved;
    new ResizeObserver(() => {
      localStorage.setItem('topRowHeight', topRow.offsetHeight + 'px');
    }).observe(topRow);
  }
}

// ─── URL add ──────────────────────────────────────────────────────────────────
function addUrl(e) {
  e.preventDefault();
  const input = document.getElementById('url-input');
  const url = input.value.trim();
  if (!url) return;
  input.value = '';

  const id = Date.now().toString(36) + Math.random().toString(36).slice(2);
  const article = {
    id, url,
    domain: (() => { try { return new URL(url).hostname.replace('www.',''); } catch { return url.slice(0,30); } })(),
    status: 'pending',
    originalText: '',
    bodyIterations: [],
    selectedBodyIteration: 0,
    titleIterations: [],
    selectedTitleIteration: 0,
    selectedTitleIndex: 0,
    imageIterations: [],
    selectedImageIteration: 0,
    cost: { translation: 0, titles: 0, image: 0 },
  };

  articles.push(article);
  if (!selectedId) selectedId = id;
  renderSidebar();
  renderPanel();
  processArticle(id);
}

// ─── Pipeline ─────────────────────────────────────────────────────────────────
async function processArticle(id) {
  const a = getArticle(id);
  if (!a) return;

  // 1. Scrape
  setStatus(id, 'scraping'); renderSidebar();
  const scraped = await api('/api/scrape', { url: a.url });
  if (scraped.error) { setStatus(id, 'error', scraped.error); renderSidebar(); if (selectedId===id) renderPanel(); return; }
  a.originalText = scraped.content;
  a.scrapedTitle = scraped.title;

  // 2. Translate
  setStatus(id, 'translating'); renderSidebar(); if (selectedId===id) renderPanel();
  const translated = await api('/api/translate', { text: a.originalText });
  if (translated.error) { setStatus(id, 'error', translated.error); renderSidebar(); if (selectedId===id) renderPanel(); return; }
  a.bodyIterations.push(translated.text);
  a.selectedBodyIteration = a.bodyIterations.length - 1;
  if (!a.cost) a.cost = { translation: 0, titles: 0, image: 0 };
  a.cost.translation += calcTextCostCAD(translated.model, translated.inputTokens, translated.outputTokens);

  // 3. Titles (parallel with image)
  setStatus(id, 'generating'); renderSidebar(); if (selectedId===id) renderPanel();
  const [titlesRes, imageRes] = await Promise.all([
    api('/api/titles', { article: translated.text }),
    api('/api/image', { summary: (scraped.excerpt || scraped.title || '').slice(0, 300), articleText: a.originalText })
  ]);

  if (titlesRes.titles) {
    a.titleIterations.push(titlesRes.titles);
    a.selectedTitleIteration = a.titleIterations.length - 1;
    a.cost.titles += calcTextCostCAD(titlesRes.model, titlesRes.inputTokens, titlesRes.outputTokens);
  }
  if (imageRes.image) {
    a.imageIterations.push({ data: imageRes.image, prompt: imageRes.prompt, creativePrompt: imageRes.creativePrompt });
    a.selectedImageIteration = a.imageIterations.length - 1;
    a.cost.image += calcTextCostCAD(imageRes.promptModel, imageRes.promptInputTokens, imageRes.promptOutputTokens);
    a.cost.image += calcImgCostCAD(imageRes.model);
  }

  setStatus(id, 'done'); renderSidebar(); if (selectedId===id) renderPanel();
  autoSave();
}

// ─── Regenerate ───────────────────────────────────────────────────────────────
async function regenerateAll() {
  const a = selected(); if (!a) return;
  processArticle(a.id);
}

async function regenerateBody() {
  const a = selected(); if (!a || !a.originalText) return;
  const btn = event.target;
  btn.textContent = '…'; btn.disabled = true;
  const r = await api('/api/translate', { text: a.originalText });
  btn.textContent = '↺ 재생성'; btn.disabled = false;
  if (r.error) return alert(r.error);
  a.bodyIterations.push(r.text);
  a.selectedBodyIteration = a.bodyIterations.length - 1;
  if (!a.cost) a.cost = { translation: 0, titles: 0, image: 0 };
  a.cost.translation += calcTextCostCAD(r.model, r.inputTokens, r.outputTokens);
  renderPanel(); autoSave();
}

async function regenerateTitles() {
  const a = selected(); if (!a) return;
  const body = a.bodyIterations[a.selectedBodyIteration];
  if (!body) return;
  const btn = event.target;
  btn.textContent = '…'; btn.disabled = true;
  const r = await api('/api/titles', { article: body });
  btn.textContent = '↺ 재생성'; btn.disabled = false;
  if (r.error) return alert(r.error);
  if (r.titles) {
    a.titleIterations.push(r.titles);
    a.selectedTitleIteration = a.titleIterations.length - 1;
    a.selectedTitleIndex = 0;
    if (!a.cost) a.cost = { translation: 0, titles: 0, image: 0 };
    a.cost.titles += calcTextCostCAD(r.model, r.inputTokens, r.outputTokens);
  }
  renderPanel(); autoSave();
}

async function regenerateImage() {
  const a = selected(); if (!a) return;
  const btn = event.target;
  btn.textContent = '…'; btn.disabled = true;
  const summary = (a.scrapedTitle || '').slice(0, 300);
  const articleText = a.originalText || '';
  const r = await api('/api/image', { summary, articleText });
  btn.textContent = '↺ 재생성'; btn.disabled = false;
  if (r.error) return alert(r.error);
  a.imageIterations.push({ data: r.image, prompt: r.prompt, creativePrompt: r.creativePrompt });
  a.selectedImageIteration = a.imageIterations.length - 1;
  if (!a.cost) a.cost = { translation: 0, titles: 0, image: 0 };
  a.cost.image += calcTextCostCAD(r.promptModel, r.promptInputTokens, r.promptOutputTokens);
  a.cost.image += calcImgCostCAD(r.model);
  renderPanel(); autoSave();
}

// ─── Iteration nav ────────────────────────────────────────────────────────────
function stepBodyIter(dir) {
  const a = selected(); if (!a) return;
  a.selectedBodyIteration = clamp(a.selectedBodyIteration + dir, 0, a.bodyIterations.length - 1);
  renderPanel();
}
function stepTitleIter(dir) {
  const a = selected(); if (!a) return;
  a.selectedTitleIteration = clamp(a.selectedTitleIteration + dir, 0, a.titleIterations.length - 1);
  renderPanel();
}
function stepImgIter(dir) {
  const a = selected(); if (!a) return;
  a.selectedImageIteration = clamp(a.selectedImageIteration + dir, 0, a.imageIterations.length - 1);
  renderPanel(); autoSave();
}

// ─── Lightbox ─────────────────────────────────────────────────────────────────
function openLightbox(dataUrl) {
  document.getElementById('lightbox-img').src = dataUrl;
  document.getElementById('lightbox').classList.add('open');
  document.addEventListener('keydown', onLightboxKey);
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
  document.removeEventListener('keydown', onLightboxKey);
}
function onLightboxKey(e) { if (e.key === 'Escape') closeLightbox(); }

// ─── Split view ───────────────────────────────────────────────────────────────
function toggleSplitView() {
  splitViewEnabled = !splitViewEnabled;
  const btn = document.getElementById('split-toggle-btn');
  if (btn) btn.classList.toggle('primary', splitViewEnabled);
  renderPanel();
}

// ─── Custom prompt regeneration ───────────────────────────────────────────────
async function regenerateBodyCustom() {
  const a = selected(); if (!a || !a.originalText) return;
  const customInstruction = document.getElementById('body-custom-prompt').value.trim();
  if (!customInstruction) return regenerateBody();
  const btn = event.target;
  btn.textContent = '…'; btn.disabled = true;
  const r = await api('/api/translate', { text: a.originalText, customInstruction });
  btn.textContent = '↺ 재번역'; btn.disabled = false;
  if (r.error) return alert(r.error);
  a.bodyIterations.push(r.text);
  a.selectedBodyIteration = a.bodyIterations.length - 1;
  if (!a.cost) a.cost = { translation: 0, titles: 0, image: 0 };
  a.cost.translation += calcTextCostCAD(r.model, r.inputTokens, r.outputTokens);
  renderPanel(); autoSave();
}

async function regenerateImageCustom() {
  const a = selected(); if (!a) return;
  const customInstruction = document.getElementById('image-custom-prompt').value.trim();
  if (!customInstruction) return regenerateImage();
  const btn = event.target;
  btn.textContent = '…'; btn.disabled = true;
  const summary = (a.scrapedTitle || '').slice(0, 300);
  const r = await api('/api/image', { summary, articleText: a.originalText || '', customInstruction });
  btn.textContent = '↺ 이미지 생성'; btn.disabled = false;
  if (r.error) return alert(r.error);
  a.imageIterations.push({ data: r.image, prompt: r.prompt, creativePrompt: r.creativePrompt });
  a.selectedImageIteration = a.imageIterations.length - 1;
  if (!a.cost) a.cost = { translation: 0, titles: 0, image: 0 };
  a.cost.image += calcTextCostCAD(r.promptModel, r.promptInputTokens, r.promptOutputTokens);
  a.cost.image += calcImgCostCAD(r.model);
  renderPanel(); autoSave();
}

// ─── Render sidebar ───────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('article-list');
  document.getElementById('article-count').textContent = `${articles.length}개 기사`;
  list.innerHTML = '';

  // collapsed dots
  const dots = document.getElementById('sidebar-collapsed-dots');
  dots.innerHTML = '';

  articles.forEach((a, i) => {
    const selTitle = a.titleIterations?.[a.selectedTitleIteration]?.[a.selectedTitleIndex];
    const displayTitle = selTitle?.title || a.scrapedTitle || a.url.slice(0,40);

    // dot
    const dot = document.createElement('div');
    dot.className = 'collapsed-dot ' + (a.status==='done' ? 'done' : a.status==='error' ? '' : 'working');
    dot.title = `${i+1}. ${a.domain}`;
    dots.appendChild(dot);

    // item
    const item = document.createElement('div');
    item.className = 'article-item' + (a.id === selectedId ? ' active' : '');
    item.dataset.id = a.id;
    item.draggable = true;
    item.innerHTML = `
      <div class="drag-handle"><span></span><span></span><span></span></div>
      <div class="article-item-body">
        <div class="article-item-meta">
          <span class="article-item-domain">${i+1}. ${a.domain}</span>
          <span class="status-badge ${statusClass(a.status)}">${statusLabel(a.status)}</span>
        </div>
        <div class="article-item-title">${escHtml(displayTitle)}</div>
        ${fmtCAD(articleCostCAD(a)) ? `<div class="article-cost">${fmtCAD(articleCostCAD(a))}</div>` : ''}
      </div>
      <button class="article-delete-btn" onclick="deleteArticle('${a.id}',event)" title="삭제">✕</button>
    `;
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('article-delete-btn')) return;
      selectedId = a.id;
      renderSidebar();
      renderPanel();
    });
    // drag
    item.addEventListener('dragstart', e => { dragSrcId = a.id; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('drag-over'); });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => { e.preventDefault(); item.classList.remove('drag-over'); reorderArticle(dragSrcId, a.id); });

    list.appendChild(item);
  });
  updateTotalCost();
}

function reorderArticle(srcId, targetId) {
  if (srcId === targetId) return;
  const si = articles.findIndex(a => a.id === srcId);
  const ti = articles.findIndex(a => a.id === targetId);
  if (si === -1 || ti === -1) return;
  const [item] = articles.splice(si, 1);
  articles.splice(ti, 0, item);
  renderSidebar();
  autoSave();
}

function deleteArticle(id, e) {
  e.stopPropagation();
  if (!confirm('이 기사를 삭제할까요?')) return;
  articles = articles.filter(a => a.id !== id);
  if (selectedId === id) selectedId = articles[0]?.id || null;
  renderSidebar();
  renderPanel();
  autoSave();
}

// ─── Render panel ─────────────────────────────────────────────────────────────
function renderPanel() {
  const a = selected();
  const topbar = document.getElementById('panel-topbar');
  const empty = document.getElementById('panel-empty');
  const content = document.getElementById('panel-content');

  if (!a) {
    topbar.style.display = 'none';
    empty.style.display = 'flex';
    content.style.display = 'none';
    return;
  }

  topbar.style.display = 'flex';
  empty.style.display = 'none';
  content.style.display = 'flex';

  document.getElementById('panel-source').textContent = `${a.domain} · ${statusLabel(a.status)}`;
  const urlEl = document.getElementById('panel-url');
  if (urlEl) { urlEl.href = a.url; urlEl.textContent = a.url; urlEl.title = a.url; }

  // ── Titles ──
  const titlesBody = document.getElementById('titles-body');
  const titleIters = a.titleIterations || [];
  const curTitles = titleIters[a.selectedTitleIteration] || [];

  updateIterNav('title', a.selectedTitleIteration, titleIters.length);

  if (a.status === 'error' && titleIters.length === 0) {
    titlesBody.innerHTML = `<div class="working-msg" style="color:var(--red);">오류: ${escHtml(a.error || '알 수 없는 오류')}</div>`;
  } else if (a.status !== 'done' && titleIters.length === 0) {
    titlesBody.innerHTML = `<div class="working-msg"><span class="spinner"></span> ${statusLabel(a.status)}...</div>`;
  } else if (curTitles.length === 0) {
    titlesBody.innerHTML = `<div class="working-msg" style="color:var(--text3);">제목 없음</div>`;
  } else {
    const titleText = curTitles.map(t => `${t.title || ''}\n${t.subtitle || ''}`).join('\n\n');
    titlesBody.innerHTML = `<textarea
      style="flex:1;width:100%;height:100%;padding:14px 16px;font-size:16px;font-family:inherit;line-height:1.8;border:none;outline:none;resize:none;background:transparent;color:var(--text);"
      onblur="saveTitleTextarea('${a.id}', ${a.selectedTitleIteration}, this.value)"
      placeholder="제목과 소제목이 여기에 표시됩니다..."
    >${escHtml(titleText)}</textarea>`;
  }

  // ── Image ──
  const imgIters = a.imageIterations || [];
  const curImg = imgIters[a.selectedImageIteration];
  updateIterNav('img', a.selectedImageIteration, imgIters.length);

  const preview = document.getElementById('image-preview');
  const promptLabel = document.getElementById('image-prompt-label');
  const promptText = document.getElementById('image-prompt-text');
  const fullPromptWrap = document.getElementById('image-full-prompt-wrap');
  const fullPromptEl = document.getElementById('image-full-prompt');

  if (curImg) {
    _displayedImageData = curImg.data;
    const imgEl = document.createElement('img');
    imgEl.src = curImg.data;
    imgEl.alt = '생성 이미지';
    imgEl.title = '클릭하여 크게 보기';
    imgEl.addEventListener('click', () => openLightbox(curImg.data));
    preview.innerHTML = '';
    preview.appendChild(imgEl);

    // Always show the full combined prompt. If we also have the AI-generated part, show it separately above.
    if (curImg.creativePrompt) {
      promptLabel.textContent = 'AI 생성 프롬프트 (기사 분석)';
      promptText.textContent = curImg.creativePrompt;
      if (fullPromptWrap) {
        fullPromptEl.textContent = curImg.prompt || '';
        fullPromptWrap.style.display = '';
      }
    } else {
      promptLabel.textContent = '최종 이미지 프롬프트';
      promptText.textContent = curImg.prompt || '—';
      if (fullPromptWrap) fullPromptWrap.style.display = 'none';
    }
  } else {
    _displayedImageData = null;
    preview.innerHTML = `<div id="image-placeholder" style="color:var(--text3);font-size:12px;text-align:center;">${a.status==='generating'?'생성 중...':'이미지 없음'}</div>`;
    promptText.textContent = '—';
    if (fullPromptWrap) fullPromptWrap.style.display = 'none';
  }

  // ── Body ──
  const bodyIters = a.bodyIterations || [];
  const curBody = bodyIters[a.selectedBodyIteration] || '';
  updateIterNav('body', a.selectedBodyIteration, bodyIters.length);

  const bodyEl = document.getElementById('body-content');
  const splitView = document.getElementById('split-view');
  const splitBtn = document.getElementById('split-toggle-btn');

  if (splitViewEnabled && a.originalText) {
    bodyEl.style.display = 'none';
    splitView.style.display = 'flex';
    document.getElementById('split-original').innerHTML =
      `<div class="split-label">원문 (English)</div><div style="white-space:pre-wrap;">${escHtml(a.originalText)}</div>`;
    document.getElementById('split-translated').innerHTML =
      `<div class="split-label">번역 (한국어)</div><div style="white-space:pre-wrap;">${escHtml(curBody)}</div>`;
    if (splitBtn) { splitBtn.textContent = '✕ 비교 닫기'; splitBtn.classList.add('primary'); }
  } else {
    bodyEl.style.display = '';
    splitView.style.display = 'none';
    if (splitBtn) { splitBtn.textContent = '⇔ 원문 비교'; splitBtn.classList.remove('primary'); }
    bodyEl.contentEditable = 'false';
    if (a.status === 'error' && bodyIters.length === 0) {
      bodyEl.innerHTML = `<div class="working-msg" style="color:var(--red);">오류: ${escHtml(a.error || '알 수 없는 오류')}</div>`;
    } else if (a.status !== 'done' && bodyIters.length === 0) {
      bodyEl.innerHTML = `<div class="working-msg"><span class="spinner"></span> ${statusLabel(a.status)}...</div>`;
    } else {
      bodyEl.textContent = curBody;
    }
  }
}

function updateIterNav(prefix, cur, total) {
  const count = document.getElementById(`${prefix}-iter-count`);
  const prev = document.getElementById(`${prefix}-prev`);
  const next = document.getElementById(`${prefix}-next`);
  count.textContent = total === 0 ? '—' : `${cur+1}/${total}`;
  prev.disabled = cur <= 0 || total === 0;
  next.disabled = cur >= total - 1 || total === 0;
}

function selectTitle(idx) {
  const a = selected(); if (!a) return;
  a.selectedTitleIndex = idx;
  renderPanel();
  autoSave();
}

function selectTitlePair(idx) {
  const a = selected(); if (!a) return;
  a.selectedTitleIndex = idx;
  // Update classes without full re-render
  document.querySelectorAll('.title-pair').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    const num = el.querySelector('.title-pair-num');
    if (num) num.textContent = `옵션 ${i+1}${i === idx ? ' · 선택됨' : ''}`;
  });
  autoSave();
}

function saveTitleTextarea(id, iter, text) {
  const a = getArticle(id); if (!a) return;
  const blocks = text.trim().split(/\n\s*\n/);
  if (!a.titleIterations[iter]) return;
  blocks.forEach((block, i) => {
    if (!a.titleIterations[iter][i]) return;
    const lines = block.trim().split('\n');
    a.titleIterations[iter][i].title = (lines[0] || '').trim();
    a.titleIterations[iter][i].subtitle = (lines[1] || '').trim();
  });
  autoSave();
}

function updateTitleField(id, iter, idx, field, value) {
  const a = getArticle(id); if (!a) return;
  if (a.titleIterations[iter]?.[idx]) {
    a.titleIterations[iter][idx][field === 'title' ? 'title' : 'subtitle'] = value;
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 1500);
}

async function regenerateTitlesCustom() {
  const a = selected(); if (!a) return;
  const customInstruction = document.getElementById('titles-custom-prompt').value.trim();
  if (!customInstruction) return regenerateTitles();
  const body = a.bodyIterations[a.selectedBodyIteration];
  if (!body) return;
  const btn = event.target;
  btn.textContent = '…'; btn.disabled = true;
  const r = await api('/api/titles', { article: body, customInstruction });
  btn.textContent = '↺ 재생성'; btn.disabled = false;
  if (r.error) return alert(r.error);
  if (r.titles) {
    a.titleIterations.push(r.titles);
    a.selectedTitleIteration = a.titleIterations.length - 1;
    a.selectedTitleIndex = 0;
    if (!a.cost) a.cost = { translation: 0, titles: 0, image: 0 };
    a.cost.titles += calcTextCostCAD(r.model, r.inputTokens, r.outputTokens);
  }
  renderPanel(); autoSave();
}

// ─── Inline editing ───────────────────────────────────────────────────────────
function makeEditable(el, id, field, optIdx) {
  el.contentEditable = 'true';
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range);

  const save = () => {
    el.contentEditable = 'false';
    const a = getArticle(id); if (!a) return;
    const iter = parseInt(el.dataset.iter);
    if (field === 'title') a.titleIterations[iter][optIdx].title = el.textContent;
    if (field === 'subtitle') a.titleIterations[iter][optIdx].subtitle = el.textContent;
    autoSave();
  };
  el.addEventListener('blur', save, { once: true });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
}

function enableBodyEdit() {
  const a = selected(); if (!a) return;
  const el = document.getElementById('body-content');
  if (el.contentEditable === 'true') return;
  el.contentEditable = 'true';
  el.focus();
  el.addEventListener('blur', () => {
    el.contentEditable = 'false';
    a.bodyIterations[a.selectedBodyIteration] = el.textContent;
    autoSave();
  }, { once: true });
}

// ─── Sidebar collapse ─────────────────────────────────────────────────────────
function toggleSidebar() {
  sidebarCollapsed = !sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
  document.getElementById('sidebar-toggle-btn').textContent = sidebarCollapsed ? '▶' : '◀';
}

// ─── Download ─────────────────────────────────────────────────────────────────
function articleToText(a) {
  const sel = a.titleIterations?.[a.selectedTitleIteration]?.[a.selectedTitleIndex];
  return [sel?.title||'', sel?.subtitle||'', '', a.bodyIterations?.[a.selectedBodyIteration]||''].join('\n');
}

function safeFileName(str) {
  return (str||'article').replace(/[^가-힣\w]/g,'_').slice(0,50);
}

function downloadSingle() {
  const a = selected(); if (!a) return;
  const sel = a.titleIterations?.[a.selectedTitleIteration]?.[a.selectedTitleIndex];
  const name = safeFileName(sel?.title || a.domain);
  const idx = articles.indexOf(a);
  const num = String(idx+1).padStart(2,'0');
  const baseName = `${num}_${name}`;
  triggerDownload(articleToText(a), `${baseName}.txt`, 'text/plain;charset=utf-8');
  const img = _displayedImageData || a.imageIterations?.[a.selectedImageIteration]?.data;
  if (img) triggerDownloadDataURL(img, `${baseName}.jpg`);
}

async function downloadAll() {
  if (!articles.length) return alert('다운로드할 기사가 없습니다');
  const zip = new JSZip();
  articles.forEach((a, i) => {
    const sel = a.titleIterations?.[a.selectedTitleIteration]?.[a.selectedTitleIndex];
    const num = String(i+1).padStart(2,'0');
    const name = safeFileName(sel?.title || a.domain);
    const baseName = `${num}_${name}`;
    zip.file(`${baseName}.txt`, articleToText(a));
    const img = a.imageIterations?.[a.selectedImageIteration]?.data;
    if (img) {
      const b64 = img.replace(/^data:image\/\w+;base64,/, '');
      zip.file(`${baseName}.jpg`, b64, { base64: true });
    }
  });
  const blob = await zip.generateAsync({ type: 'blob' });
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  triggerDownload(blob, `뉴스번역_${dateStr}.zip`, 'application/zip');
}

function triggerDownload(content, filename, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function triggerDownloadDataURL(dataUrl, filename) {
  // Convert data URL → blob to avoid browser size limits on raw data URLs
  const parts = dataUrl.match(/^data:(.*?);base64,(.*)$/s);
  if (parts) {
    const mime = parts[1];
    const bytes = atob(parts[2]);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    const blob = new Blob([arr], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } else {
    const a = document.createElement('a');
    a.href = dataUrl; a.download = filename; a.click();
  }
}

// ─── Auto-save ────────────────────────────────────────────────────────────────
function autoSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await fetch('/api/save-state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ articles }) });
    const s = document.getElementById('save-status');
    s.classList.add('show');
    setTimeout(() => s.classList.remove('show'), 2000);
  }, 1000);
}

// ─── Settings ─────────────────────────────────────────────────────────────────
const MODEL_OPTS = {
  gemini: GEMINI_MODELS,
  openai: OPENAI_TEXT_MODELS,
  'openai-image': OPENAI_IMAGE_MODELS,
  'gemini-image': GEMINI_IMAGE_MODELS,
};

function openSettings() {
  // populate fields
  document.getElementById('key-gemini').value = settings.apiKeys?.gemini || '';
  document.getElementById('key-openai').value = settings.apiKeys?.openai || '';

  ['trans','titles','image'].forEach(k => {
    const taskKey = k === 'trans' ? 'translation' : k;
    const r = settings.aiRouting?.[taskKey] || {};
    const provSel = document.getElementById(`route-${k}-provider`);
    provSel.value = r.provider || (k === 'image' ? 'openai' : 'gemini');
    updateModelOptions(k);
    document.getElementById(`route-${k}-model`).value = r.model || '';
  });

  document.getElementById('prompt-translation-text').value = settings.prompts?.translation || '';
  document.getElementById('prompt-titles-text').value = settings.prompts?.titles || '';
  document.getElementById('prompt-image-text').value = settings.prompts?.image || '';

  document.getElementById('save-folder').value = settings.saveFolder || '';
  updateSaveFolderPreview();
  const toggle = document.getElementById('auto-load-toggle');
  toggle.className = 'toggle ' + (settings.autoLoadToday ? 'on' : 'off');

  document.getElementById('settings-overlay').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}

function updateModelOptions(k) {
  const taskKey = k === 'trans' ? 'translation' : k;
  const provider = document.getElementById(`route-${k}-provider`).value;
  const modelSel = document.getElementById(`route-${k}-model`);
  const isImage = k === 'image';
  let models;
  if (isImage) {
    models = provider === 'openai' ? OPENAI_IMAGE_MODELS : GEMINI_IMAGE_MODELS;
  } else {
    models = provider === 'openai' ? OPENAI_TEXT_MODELS : GEMINI_MODELS;
  }
  const cur = settings.aiRouting?.[taskKey]?.model || models[0];
  modelSel.innerHTML = models.map(m => `<option value="${m}" ${m===cur?'selected':''}>${m}</option>`).join('');
  if (isImage) updateImageSizeOptions();
}

function updateImageSizeOptions() {
  const model = document.getElementById('route-image-model')?.value || '';
  const sizeSel = document.getElementById('route-image-size');
  if (!sizeSel) return;
  const opts = IMAGE_SIZES[model] || DEFAULT_IMAGE_SIZES;
  const cur = settings.aiRouting?.image?.imageSize || '1536x1024';
  sizeSel.innerHTML = opts.map(o => `<option value="${o.v}" ${o.v===cur?'selected':''}>${o.l}</option>`).join('');
}

function showSettingsTab(tab) {
  document.querySelectorAll('.settings-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  event.target.classList.add('active');
}

function showPromptTab(key) {
  ['translation','titles','image'].forEach(k => {
    document.getElementById(`prompt-${k}`).style.display = k === key ? 'block' : 'none';
  });
  document.querySelectorAll('.prompt-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

function toggleKey(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

function toggleAutoLoad() {
  const t = document.getElementById('auto-load-toggle');
  const isOn = t.classList.contains('on');
  t.className = 'toggle ' + (isOn ? 'off' : 'on');
}

function updateSaveFolderPreview() {
  const folder = document.getElementById('save-folder').value;
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  document.getElementById('save-folder-preview').textContent = folder ? `오늘 기사 저장 위치 → ${folder}/${dateStr}/` : '';
}
document.getElementById('save-folder').addEventListener('input', updateSaveFolderPreview);

async function saveSettings() {
  settings.apiKeys = {
    gemini: document.getElementById('key-gemini').value,
    openai: document.getElementById('key-openai').value,
  };
  settings.aiRouting = {
    translation: { provider: document.getElementById('route-trans-provider').value, model: document.getElementById('route-trans-model').value },
    titles:      { provider: document.getElementById('route-titles-provider').value, model: document.getElementById('route-titles-model').value },
    image:       { provider: document.getElementById('route-image-provider').value, model: document.getElementById('route-image-model').value, imageSize: document.getElementById('route-image-size').value || '1536x1024' },
  };
  settings.prompts = {
    translation: document.getElementById('prompt-translation-text').value,
    titles:      document.getElementById('prompt-titles-text').value,
    image:       document.getElementById('prompt-image-text').value,
  };
  settings.saveFolder = document.getElementById('save-folder').value;
  settings.autoLoadToday = document.getElementById('auto-load-toggle').classList.contains('on');

  await fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(settings) });
  closeSettings();
}

async function resetPrompts() {
  if (!confirm('프롬프트를 기본값으로 초기화할까요?')) return;
  const defaults = await fetch('/api/settings').then(r => r.json());
  document.getElementById('prompt-translation-text').value = defaults.prompts.translation;
  document.getElementById('prompt-titles-text').value = defaults.prompts.titles;
  document.getElementById('prompt-image-text').value = defaults.prompts.image;
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function api(path, body) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(r => r.json()).catch(e => ({ error: e.message }));
}

function getArticle(id) { return articles.find(a => a.id === id); }
function selected() { return getArticle(selectedId); }
function setStatus(id, status, err) { const a = getArticle(id); if (a) { a.status = status; if (err) a.error = err; } }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function statusLabel(s) {
  return { pending:'대기 중', scraping:'스크래핑 중', translating:'번역 중', generating:'생성 중', done:'완료', error:'오류' }[s] || s;
}
function statusClass(s) {
  return { done:'done', error:'error', pending:'pending' }[s] || 'working';
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
init();
